name: Automation Ping

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call automation endpoint
        run: |
          curl -X POST "${{ secrets.AUTOMATION_ENDPOINT }}" \
            -H "X-Automation-Token: ${{ secrets.AUTOMATION_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json"
