name: Automation Ping

on:
  schedule:
    - cron: "35 4 * * *"
    - cron: "35 13 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call automation endpoint
        run: |
          curl --fail --silent --show-error --max-time 180 -X POST "${{ secrets.AUTOMATION_ENDPOINT }}" \
            -H "X-Automation-Token: ${{ secrets.AUTOMATION_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json"
